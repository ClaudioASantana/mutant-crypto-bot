# A generic, single database configuration.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .

# O valor aqui é apenas placeholder; `migrations/env.py` sobrescreve a URL a
# partir de `OperationalConfig.sqlalchemy_database_url`, que é a fonte de
# verdade do runtime.
sqlalchemy.url = sqlite:///./override-me.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
