version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mutant-backend
    ports:
      - "8010:8000"
    env_file:
      - ./backend/.env
    volumes:
      - mutant-chromadb:/app/chroma_db
      - ./docs:/docs:ro
    environment:
      - CHROMA_DB_DIR=chroma_db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_PORT=8010
    container_name: mutant-frontend
    ports:
      - "3010:3000"
    environment:
      - NEXT_PUBLIC_API_PORT=8010
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  mutant-chromadb:
