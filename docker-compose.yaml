services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --requirepass "mutant_redis_dev"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - CELERY_BROKER_URL=redis://:mutant_redis_dev@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:mutant_redis_dev@redis:6379/0
      - OPENAI_BASE_URL=http://host.docker.internal:8080/v1
    command: ["celery", "-A", "app.infrastructure.queue.celery_app.celery_app", "worker", "--loglevel=info"]
    depends_on:
      - redis
    restart: unless-stopped
    volumes:
      - mutant-chromadb:/app/chroma_db
      - ./backend/data:/app/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
    - CHROMA_DB_DIR=chroma_db
    - CELERY_BROKER_URL=redis://:mutant_redis_dev@redis:6379/0
    - CELERY_RESULT_BACKEND=redis://:mutant_redis_dev@redis:6379/0
    - OPENAI_BASE_URL=http://host.docker.internal:8080/v1
    labels:
    - traefik.enable=true
    - traefik.http.routers.mutant-backend.rule=Host(`dev-api.mutante.grupocin.com.br`)
    - traefik.http.services.mutant-backend.loadbalancer.server.port=8000
    ports:
    - '8000'
    restart: unless-stopped
    volumes:
    - mutant-chromadb:/app/chroma_db
    - ./docs:/docs:ro
    - ./backend/data:/app/data
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_PORT: ${BACKEND_PORT:-8010}
    depends_on:
    - backend
    environment:
    - NEXT_PUBLIC_API_PORT=${BACKEND_PORT:-8010}
    labels:
    - traefik.enable=true
    - traefik.http.routers.mutant-frontend.rule=Host(`dev-mutante.grupocin.com.br`)
    - traefik.http.services.mutant-frontend.loadbalancer.server.port=3000
    ports:
    - '3000'
    restart: unless-stopped
volumes:
  mutant-chromadb: null
  redis_data: null
