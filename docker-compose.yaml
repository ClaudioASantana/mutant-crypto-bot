services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - mutant-chromadb:/app/chroma_db
      - ./docs:/docs:ro
    environment:
      - CHROMA_DB_DIR=chroma_db
    restart: unless-stopped
    ports:
      - "8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_PORT=${BACKEND_PORT:-8010}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000"

volumes:
  mutant-chromadb:
